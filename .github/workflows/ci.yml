name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Enforce statement coverage threshold
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')"
          echo "Total statement coverage: ${coverage}"
          # Require at least 90% total statement coverage.
          if awk -v cov="${coverage%\%}" 'BEGIN { exit !(cov < 90.0) }'; then
            echo "coverage ${coverage} is below the required threshold 90.0%" >&2
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o gha${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/gha
  race:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with race detector
        run: go test -race ./...
