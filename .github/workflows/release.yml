name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  build:
    name: Build release archives
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install goversioninfo
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build archives
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gha-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: gha ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## 安装说明

            下载对应平台的压缩包，解压后将 `gha`（Windows 为 `gha.exe`）添加到 PATH。

            ### Windows 用户注意

            Windows Defender 可能会误报该程序。这是因为 Go 静态编译和网络操作导致的误报。

            你可以：
            - 在 Windows Defender 中添加排除项
            - 查看源代码确认安全性
            - 从源码自行编译

            我们已向 Microsoft 提交误报申请。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
