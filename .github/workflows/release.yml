name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        id: create-tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [create-tag]
    if: always() && (github.event_name == 'push' || needs.create-tag.result == 'success')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install goversioninfo for Windows builds
        if: matrix.goos == 'windows'
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate Windows version info
        if: matrix.goos == 'windows'
        run: |
          cd cmd/gha
          goversioninfo -o resource.syso

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            go build -ldflags="-s -w" -o dist/gh-account-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./cmd/gha
          else
            go build -ldflags="-s -w" -o dist/gh-account-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/gha
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gh-account-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            ## 安装说明

            下载对应平台的二进制文件，重命名为 `gh-account`（Windows 为 `gh-account.exe`），然后添加到 PATH。

            ### Windows 用户注意

            Windows Defender 可能会误报该程序。这是因为 Go 静态编译和网络操作导致的误报。

            你可以：
            - 在 Windows Defender 中添加排除项
            - 查看源代码确认安全性
            - 从源码自行编译

            我们已向 Microsoft 提交误报申请。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
