name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.4.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release archives
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Resolve version
        id: meta
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${RELEASE_INPUT}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install goversioninfo
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build archives
        env:
          DIST: dist
        run: ./scripts/build-release.sh "${{ steps.meta.outputs.version }}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: gha-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: gha-${{ needs.build.outputs.version }}
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: gha ${{ needs.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## 安装说明

            下载对应平台的压缩包，解压后将 `gha`（Windows 为 `gha.exe`）添加到 PATH。

            ### Windows 用户注意

            Windows Defender 可能会误报该程序。这是因为 Go 静态编译和网络操作导致的误报。

            你可以：
            - 在 Windows Defender 中添加排除项
            - 查看源代码确认安全性
            - 从源码自行编译

            我们已向 Microsoft 提交误报申请。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
